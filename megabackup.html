<body>

  <!-- Ambient blur elements -->

  <!-- 1. Lock Screen (Login Card) -->
  <div id="lock-screen" class="container">
    <div class="card">
      <div class="logo-container">
        <div class="logo-icon">🔑</div>
        <h1 class="app-title">TextVault</h1>
        <p class="app-subtitle">Secure, Client-Side Text Vault</p>
      </div>

      <div class="form-group">
        <div class="input-wrapper">
          <input type="password" id="password-input" class="input-field" placeholder="Enter password here ...">
          <button id="password-toggle" class="visibility-toggle" title="Reveal password">
            <span id="eye-icon">👁️</span>
          </button>
        </div>
      </div>

      <button id="unlock-btn" class="btn">
        <span>Unlock Vault</span>
        <span>🔓</span>
      </button>

      <div id="error-message" class="error-msg"></div>

      <div class="info-footer">
        Use password <code>demo</code> for example vault
      </div>
    </div>
  </div>

  <!-- 2. Main Dashboard (Hidden by default) -->
  <div id="dashboard" class="dashboard">
    <!-- Header -->
    <header class="dashboard-header">
      <div class="header-logo">
        <div style="font-size: 1.5rem;">🔑</div>
        <span>TextVault</span>
      </div>
      <div class="header-controls">
        <span id="updated-badge" class="meta-badge">Last Updated: -</span>
        <select id="theme-select" class="theme-select" title="Choose color theme">
          <option value="slate">Slate Dark</option>
          <option value="emerald">Emerald Oasis</option>
          <option value="ocean">Ocean Deep</option>
          <option value="amber">Amber Warmth</option>
          <option value="silver">Silver Slate (Light)</option>
          <option value="sand">Sand Warmth (Light)</option>
        </select>
        <button id="logout-btn" class="btn-icon" title="Lock Vault">
          <span>🔒</span>
        </button>
      </div>
    </header>

    <!-- Workspace Panels -->
    <div id="workspace-container" class="workspace split-mode">
      <!-- Editor Panel (Left) -->
      <div id="panel-editor" class="panel panel-editor">
        <div class="panel-header" id="editor-header">
          <div class="panel-title">Editor</div>
        </div>
        <div class="panel-body">
          <textarea id="note-editor" class="editor-textarea" placeholder="Type your markdown here..."></textarea>
        </div>
      </div>

      <!-- Preview Panel (Right) -->
      <div id="panel-preview" class="panel panel-preview">
        <div class="panel-header" id="preview-header">
          <div class="panel-title" id="preview-title">Preview (Markdown)</div>
          <div class="header-controls" id="preview-mode-controls">
            <!-- Toggles for preview mode -->
          </div>
        </div>
        <div class="panel-body">
          <div id="preview-content" class="preview-content markdown"></div>
        </div>
      </div>
    </div>

    <!-- Toolbar / Footer -->
    <footer class="dashboard-footer">
      <div class="footer-left">
        <button id="btn-toggle-edit" class="btn btn-sub btn-sm">
          <span id="edit-btn-text">Edit</span>
        </button>
        <button id="btn-toggle-split" class="btn btn-sub btn-sm" title="Toggle editor/preview split mode">
          <span>Split</span>
        </button>
        <button id="btn-mode-markdown" class="btn btn-sub btn-sm" title="Render as Markdown">
          <span>Markdown</span>
        </button>
        <button id="btn-mode-text" class="btn btn-sub btn-sm" title="Render as Plain Text">
          <span>Plain Text</span>
        </button>
      </div>
      <div class="footer-right">
        <button id="btn-download-raw" class="btn btn-sub btn-sm" title="Download the raw secret message file">
          <span>Download</span>
        </button>
        <button id="btn-export" class="btn btn-accent btn-sm" title="Export the secret message as JSON or Base64">
          <span>Export</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- 3. Export Modal -->
  <div id="export-modal" class="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title">Export Vault JSON</h2>
        <button id="modal-close" class="btn-icon" style="border: none;">❌</button>
      </div>
      <div class="modal-body">

        <!-- Toggle raw / encrypted -->
        <div class="toggle-container">
          <span class="app-subtitle" style="font-weight: 600;">Encrypt JSON Payload</span>
          <label class="switch">
            <input type="checkbox" id="encrypt-toggle" checked>
            <span class="slider"></span>
          </label>
        </div>

        <!-- Password to use for export -->
        <div class="form-group" id="export-pwd-group">
          <label for="export-password" class="app-subtitle" style="font-weight: 500;">Encryption Password</label>
          <div class="input-wrapper">
            <input type="password" id="export-password" class="input-field" placeholder="Enter encryption password...">
            <button id="export-password-toggle" class="visibility-toggle" title="Reveal password">
              <span>👁️</span>
            </button>
          </div>
        </div>

        <!-- Warning Area -->
        <div id="export-warning" class="warning-badge"></div>

        <!-- Export Preview Text Area -->
        <div class="form-group">
          <label class="app-subtitle" style="font-weight: 500;">Payload Preview</label>
          <textarea id="export-preview" class="modal-textarea" readonly></textarea>
        </div>

      </div>
      <div class="modal-footer">
        <button id="btn-copy-payload" class="btn btn-sub btn-sm">
          <span>Copy to Clipboard</span>
        </button>
        <button id="btn-modal-download" class="btn btn-accent btn-sm">
          <span>Download HTML File</span>
        </button>
      </div>
    </div>
  </div>
